name: Temu 价格自动监测

on:
  schedule:
    # 每 45 分钟跑一次（GitHub 免费额度限制下尽量高频）
    # 如需更快可在 GitHub 页面上手动 "Run workflow"
    - cron: "0,45 * * * *"
  workflow_dispatch:
    inputs:
      new_links:
        description: '新增商品链接（可多个，用逗号/换行分隔；留空则只抓取现有链接）'
        required: false
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: temu-scrape
      cancel-in-progress: false

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 追加新链接（若输入框填了链接）
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.new_links != '' }}
        run: |
          python add_links.py "${{ inputs.new_links }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: 添加新商品链接 $(date -u +%Y-%m-%d_%H:%M)"
            git push
            echo "✅ 新链接已提交"
          fi

      - name: 运行抓取（curl_cffi + 住宅代理，无需浏览器）
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          DELAY_MIN: "2"
          DELAY_MAX: "5"
        run: python scraper.py

      - name: 提交价格数据
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json products.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: 更新价格数据 $(date -u +%Y-%m-%d_%H:%M)"
            git push
            echo "✅ 价格数据已提交"
          else
            echo "数据无变化，跳过提交"
          fi
