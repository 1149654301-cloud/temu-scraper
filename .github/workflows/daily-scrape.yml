name: Temu 每日自动抓取

on:
  schedule:
    # 每天 01:00 UTC = 北京时间 09:00（可自行修改）
    - cron: "0 1 * * *"
  workflow_dispatch:
    # 允许在 GitHub 页面上手动点击"Run workflow"立即跑一次
    # 也可以在输入框里粘贴新链接，脚本会自动追加到 products.json 后抓取
    inputs:
      new_links:
        description: '新增商品链接（可多个，用逗号/换行分隔；留空则只抓取现有链接）'
        required: false
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write  # 允许自动提交续期后的 cookie 文件
    concurrency:
      group: temu-scrape
      cancel-in-progress: false

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: 追加新链接（若输入框填了链接）
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.new_links != '' }}
        run: |
          python add_links.py "${{ inputs.new_links }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: 添加新商品链接 $(date -u +%Y-%m-%d_%H:%M)"
            git push
            echo "✅ 新链接已提交"
          fi

      - name: 运行抓取（xvfb 虚拟显示器 + 有头浏览器）
        env:
          JSONBLOB_URL: ${{ secrets.JSONBLOB_URL }}
          SCRAPE_OPERATOR: ${{ secrets.SCRAPE_OPERATOR }}
          TEMU_COOKIES: ${{ secrets.TEMU_COOKIES }}
          VISION_API_KEY: ${{ secrets.VISION_API_KEY }}
          VISION_API_URL: ${{ secrets.VISION_API_URL }}
          VISION_MODEL: ${{ secrets.VISION_MODEL }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x2000x24" python scraper.py

      - name: 提交最新 cookie（自动续期）
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cookies/latest.json products.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: 自动续期 Temu cookie $(date -u +%Y-%m-%d_%H:%M)"
            git push
          else
            echo "无变化，跳过提交"
          fi

      - name: 上传运行日志与诊断截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-logs
          path: |
            artifacts/
          retention-days: 7
